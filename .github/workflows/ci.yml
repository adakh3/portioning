name: CI

# Runs the test suites in the cloud, so a regression is caught beyond the local
# pre-commit hook (which is bypassable and only runs on one machine). With
# multiple feature branches in flight, this is what keeps main green.
#
# Split: the fast gate — backend + frontend unit tests and the migration-safety
# check — runs on every push to main AND every PR. The slower, flakier e2e job
# (browser install + full-stack boot) runs on PRs only.
#
# Gating (REL-360, owner decision): backend, frontend and migrations are
# required checks on PRs to main from day one; e2e stays non-blocking for ~1
# week, then is promoted to required. "Required" is a GitHub branch-protection
# setting, configured outside this file — the workflow only reports status.
#
# Conventions mirror .github/workflows/followups-cron.yml.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A newer push to the same branch/PR cancels the older in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests (Django)
    runs-on: ubuntu-latest
    env:
      SECRET_KEY: ci-insecure-test-key
      DEBUG: "True" # avoids the prod ALLOWED_HOSTS guard; tests use sqlite
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: pip install -r backend/requirements.txt
      - name: Run tests
        working-directory: backend
        # Serial on purpose (not --parallel): Django's parallel runner pickles
        # test results across processes, and a FAILING test whose captured logs
        # carry an exc_info traceback (e.g. a view that logs a caught error)
        # makes that pickle blow up with "cannot pickle 'traceback' object",
        # masking the real failure. Serial keeps a red test readably red — which
        # is the whole point of this gate. ~730 tests run in <1 min.
        run: python manage.py test --verbosity=1

  frontend:
    name: Frontend tests (Vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Run tests
        working-directory: frontend
        run: npm run test:run

      # Again in a US timezone. The runner is UTC, where a whole class of date bug
      # is a no-op — `new Date("2026-03-10")` is UTC midnight, so rendering it in
      # the viewer's zone only moves the day WEST of Greenwich. A real one shipped
      # behind this blind spot: every booking date displayed a day early for every
      # US user, with CI green throughout. The product is US-only, so the zone that
      # matters is not the one the runner happens to use.
      - name: Run tests again in a US timezone
        working-directory: frontend
        env:
          TZ: America/New_York
        run: npm run test:run

  migrations:
    name: Migration safety (Django)
    runs-on: ubuntu-latest
    # Cheap guard against two recurring risks: migration-numbering collisions
    # across parallel worktrees, and model/migration drift (a model changed
    # without a matching migration).
    env:
      SECRET_KEY: ci-insecure-test-key
      DEBUG: "True"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: pip install -r backend/requirements.txt
      - name: Apply all migrations on a fresh sqlite DB
        working-directory: backend
        run: python manage.py migrate --noinput
      - name: Fail if models have drifted from migrations
        working-directory: backend
        run: python manage.py makemigrations --check --dry-run

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    # The slow, flake-prone job (browser install + full stack boot). Run it only
    # on PRs — the unit + migration jobs above stay as the fast gate on pushes.
    if: github.event_name == 'pull_request'
    env:
      SECRET_KEY: ci-insecure-test-key
      DEBUG: "True"
      ALLOWED_HOSTS: "localhost,127.0.0.1"
      # The operations suite (portioning, kitchen, staffing) is hidden in the
      # product by default, but its pages/engine still exist and their e2e specs
      # (calculate, kitchen, menu-choices, booking-*) drive those surfaces —
      # so the e2e stack runs with the launch flag ON to exercise them.
      OPERATIONS_ENABLED: "True"
      # One suite run is ~30 logins and several hundred API calls from a single
      # IP inside two minutes. The production rate limits are sized for real
      # humans, so the run trips `anon` (100/hour) at whichever spec happens to
      # be last — a red PR that says nothing about the code under test. Lift
      # them here ONLY; nothing sets these in a deployment, so prod keeps the
      # defaults in settings.py.
      THROTTLE_ANON: "10000/hour"
      THROTTLE_USER: "100000/hour"
      THROTTLE_DEMO_REQUESTS: "1000/hour"
      # Same reasoning for the two sign-in scopes REL-485 adds. The login limit
      # only charges FAILED attempts, so the suite's ~30 successful sign-ins no
      # longer trip it on their own — but a spec that deliberately drives a bad
      # password still can, and there are no retries, so a throttled login would
      # be a hard, confusing failure.
      LOGIN_RATE_LIMIT: "1000/min"
      TOKEN_REFRESH_RATE_LIMIT: "1000/min"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Install Playwright browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Seed the backend DB
        # Reference data (dishes/menus/rules) comes from seed.json; the demo org
        # + logins (owner@demo.test / Owner123!, matching e2e/helpers.ts) come
        # from seed_demo. Fresh sqlite each run → deterministic.
        working-directory: backend
        run: |
          python manage.py migrate --noinput
          python manage.py loaddata seed.json
          python manage.py seed_demo
      - name: Start backend (port 8000)
        working-directory: backend
        # Background process survives into later steps. Log to a file so a boot
        # failure is inspectable in the run.
        run: |
          python manage.py runserver 127.0.0.1:8000 --noreload > backend.log 2>&1 &
      - name: Build & start frontend (port 3000)
        working-directory: frontend
        # next start needs a build first. The API base defaults to
        # http://localhost:8000/api, so no env override is needed.
        run: |
          npm run build
          npm run start > frontend.log 2>&1 &
      - name: Wait for both servers
        run: npx --yes wait-on -t 120000 tcp:127.0.0.1:8000 tcp:127.0.0.1:3000
      - name: Run E2E tests
        working-directory: frontend
        run: npx playwright test
      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
      - name: Dump server logs on failure
        if: failure()
        run: |
          echo "===== backend.log ====="; cat backend/backend.log || true
          echo "===== frontend.log ====="; cat frontend/frontend.log || true
